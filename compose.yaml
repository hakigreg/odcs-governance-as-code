services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contracts}
      POSTGRES_USER: ${POSTGRES_USER:-contracts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contracts}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contracts} -d ${POSTGRES_DB:-contracts}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tooling:
    build:
      context: .
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src
      DATABASE_URL: ${DATABASE_URL:-postgresql://contracts:contracts@postgres:5432/contracts}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-contracts}
      DATACONTRACT_POSTGRES_USERNAME: ${POSTGRES_USER:-contracts}
      DATACONTRACT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contracts}
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
