apiVersion: v3.2.0
kind: DataContract
id: urn:odcs:telecom:telecom-cdr-events
name: telecom_cdr_events
version: 1.0.0
status: active
domain: telecom
dataProduct: trusted-credit-signals
contractCreatedTs: "2026-10-19T00:00:00-03:00"

description:
  purpose: >
    Provide pseudonymous telecom activity events as a governed source for
    behavioral feature engineering and portfolio-level risk analytics.
  usage: >
    Use the dataset to calculate aggregated behavioral indicators over bounded
    time windows. Consumers must use subscriber_id_hash and must not attempt to
    recover or link it to a direct customer identifier.
  limitations: >
    The dataset describes network activity, not income, identity, intent, or
    creditworthiness. Coverage varies with network availability and customer
    usage. It must not be used as the sole basis for an adverse decision.

context:
  instructions: >
    Treat each row as one network event. Aggregate by subscriber_id_hash and a
    declared time window before using the data for analytics or feature
    engineering. Always filter event_timestamp to a bounded range.
  verifiedStatements:
    - id: event-granularity
      question: What does one row represent?
      answer: One pseudonymous telecom network event generated by the synthetic source system.
    - id: identity-status
      question: Does this dataset contain a direct customer identifier?
      answer: No. It contains only a one-way pseudonymous subscriber hash.
  constraints:
    - id: no-reidentification
      constraint: Do not attempt to reverse, enrich, or link subscriber_id_hash to a natural person.
      tags: [privacy, pseudonymization]
    - id: no-individual-marketing
      constraint: Do not use event-level records for individual marketing or behavioral targeting.
      tags: [purpose-limitation]
    - id: no-sole-adverse-decision
      constraint: Do not use this dataset as the sole basis for an adverse credit decision.
      tags: [high-impact, human-oversight]

team:
  name: telecom-data-products
  description: Accountable team for the source-aligned telecom event contract.
  members:
    - username: telecom-data-owner
      role: Owner
      description: Accountable for purpose, access, and lifecycle decisions.
    - username: telecom-data-steward
      role: Data Steward
      description: Maintains definitions, classifications, and quality expectations.
    - username: telecom-platform-engineer
      role: Technical Owner
      description: Operates ingestion and resolves technical contract incidents.

servers:
  - server: local
    type: postgres
    host: ${POSTGRES_HOST:-postgres}
    port: ${POSTGRES_PORT:-5432}
    database: ${POSTGRES_DB:-contracts}
    schema: raw

schema:
  - id: telecom-cdr-events-object
    name: telecom_cdr_events
    physicalName: telecom_cdr_events
    physicalType: table
    businessName: Telecom activity events
    description: Pseudonymous call, message, and data-session events.
    dataGranularityDescription: One row per network event.
    tags: [telecom, cdr, source-aligned, pseudonymous]
    context:
      instructions: >
        Filter on event_timestamp for every query. Use subscriber_id_hash only
        for aggregation and never expose event-level subscriber histories.
      constraints:
        - id: minimum-aggregation-size
          constraint: Do not publish aggregates representing fewer than 20 distinct subscribers.
          tags: [privacy, aggregation]
    properties:
      - id: event-id
        name: event_id
        businessName: Event identifier
        description: Immutable identifier assigned to the network event.
        logicalType: string
        physicalType: uuid
        required: true
        unique: true
        primaryKey: true
        primaryKeyPosition: 1
        criticalDataElement: true
        classification: internal
        quality:
          - id: event-id-complete
            type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: Every event must have an identifier.
          - id: event-id-unique
            type: library
            metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
            description: Event identifiers must not be duplicated.

      - id: subscriber-id-hash
        name: subscriber_id_hash
        businessName: Pseudonymous subscriber identifier
        description: One-way SHA-256 hash used only to group events belonging to the same subscriber.
        logicalType: string
        physicalType: char(64)
        required: true
        criticalDataElement: true
        classification: restricted
        tags: [pseudonymous, sensitive]
        quality:
          - id: subscriber-id-complete
            type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: Every event must have a pseudonymous subscriber identifier.
          - id: subscriber-id-shape
            type: sql
            query: >
              SELECT COUNT(*) FROM telecom_cdr_events
              WHERE subscriber_id_hash !~ '^[0-9a-f]{64}$'
            mustBe: 0
            dimension: conformity
            severity: error
            description: Subscriber identifiers must be lowercase SHA-256 hexadecimal strings.
        customProperties:
          - property: privacyTechnique
            value: sha256-pseudonymization
            vendor: vektoria
          - property: directIdentifier
            value: false
            vendor: vektoria

      - id: event-timestamp
        name: event_timestamp
        businessName: Event timestamp
        description: UTC timestamp at which the network event occurred.
        logicalType: timestamp
        physicalType: timestamptz
        required: true
        criticalDataElement: true
        classification: internal
        quality:
          - id: event-timestamp-complete
            type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: Every event must include its occurrence time.

      - id: event-type
        name: event_type
        businessName: Event type
        description: Category of telecom activity represented by the event.
        logicalType: string
        physicalType: varchar(10)
        required: true
        classification: internal
        enum:
          - value: call
            label: Voice call
          - value: sms
            label: Text message
          - value: data
            label: Data session

      - id: direction
        name: direction
        businessName: Traffic direction
        description: Direction of a call or message; data sessions use not_applicable.
        logicalType: string
        physicalType: varchar(20)
        required: true
        classification: internal
        enum:
          - value: inbound
          - value: outbound
          - value: not_applicable

      - id: duration-seconds
        name: duration_seconds
        businessName: Duration in seconds
        description: Duration of a voice call; zero for other event types.
        logicalType: integer
        physicalType: integer
        required: true
        classification: internal

      - id: data-volume-mb
        name: data_volume_mb
        businessName: Data volume in megabytes
        description: Data transferred by a data session; zero for other event types.
        logicalType: number
        physicalType: numeric(12,3)
        required: true
        classification: internal

      - id: cell-region-code
        name: cell_region_code
        businessName: Network region code
        description: Coarse operational region; it is not a precise device location.
        logicalType: string
        physicalType: varchar(20)
        required: true
        classification: confidential
        tags: [coarse-location, sensitive]

      - id: ingestion-timestamp
        name: ingestion_timestamp
        businessName: Ingestion timestamp
        description: UTC timestamp at which the event became available to the platform.
        logicalType: timestamp
        physicalType: timestamptz
        required: true
        classification: internal

    quality:
      - id: positive-row-count
        type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: A delivered batch must contain at least one event.
      - id: non-negative-usage
        type: sql
        query: >
          SELECT COUNT(*) FROM telecom_cdr_events
          WHERE duration_seconds < 0 OR data_volume_mb < 0
        mustBe: 0
        dimension: conformity
        severity: error
        description: Duration and data-volume measures cannot be negative.
      - id: direction-matches-event-type
        type: sql
        query: >
          SELECT COUNT(*) FROM telecom_cdr_events
          WHERE (event_type = 'data' AND direction <> 'not_applicable')
             OR (event_type IN ('call', 'sms') AND direction = 'not_applicable')
        mustBe: 0
        dimension: consistency
        severity: error
        description: Direction must be meaningful for the event type.

slaProperties:
  - property: freshness
    value: 24
    unit: h
    element: telecom_cdr_events.ingestion_timestamp
    driver: operational
    description: New events must be available within 24 hours.
  - property: frequency
    value: 1
    unit: d
    element: telecom_cdr_events.ingestion_timestamp
    driver: operational
    description: The producer delivers one batch per day.
  - property: retention
    value: 90
    unit: d
    element: telecom_cdr_events.event_timestamp
    driver: privacy
    description: Event-level records are retained for at most 90 days in the analytical platform.

roles:
  - role: behavioral-feature-engineer
    access: read
    firstLevelApprovers: telecom-data-owner
    secondLevelApprovers: privacy-officer
  - role: telecom-platform-engineer
    access: write
    firstLevelApprovers: telecom-data-owner

support:
  - channel: data-contracts@example.com
    tool: email
    scope: issues
    url: mailto:data-contracts@example.com

tags: [telecom, regulated-ai, privacy-by-design, odcs-3-2]

customProperties:
  - property: governanceTier
    value: high-impact-source
    vendor: vektoria
  - property: syntheticDataOnly
    value: true
    vendor: vektoria
